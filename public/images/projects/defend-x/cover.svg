<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="dfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E10"/>
      <stop offset="100%" stop-color="#181122"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#dfBg)"/>
  <!-- Multi-Agent Defense Network -->
  <g transform="translate(400, 240)">
    <!-- Orbit rings -->
    <circle r="140" fill="none" stroke="rgba(168, 85, 247, 0.2)" stroke-dasharray="6 6"/>
    <circle r="90" fill="none" stroke="rgba(168, 85, 247, 0.15)"/>
    <!-- Commander Node -->
    <circle r="36" fill="#211533" stroke="#A855F7" stroke-width="2.5"/>
    <text y="5" text-anchor="middle" font-family="monospace" font-size="11" fill="#A855F7" font-weight="bold">COMMANDER</text>
    <!-- Sub-agents -->
    <g transform="translate(0, -140)">
      <circle r="26" fill="#1B1728" stroke="#00F0FF" stroke-width="1.5"/>
      <text y="4" text-anchor="middle" font-family="monospace" font-size="8" fill="#00F0FF">FITNESS</text>
    </g>
    <g transform="translate(130, -50)">
      <circle r="26" fill="#1B1728" stroke="#EC4899" stroke-width="1.5"/>
      <text y="4" text-anchor="middle" font-family="monospace" font-size="8" fill="#EC4899">ACADEMIC</text>
    </g>
    <g transform="translate(100, 110)">
      <circle r="26" fill="#1B1728" stroke="#F59E0B" stroke-width="1.5"/>
      <text y="4" text-anchor="middle" font-family="monospace" font-size="8" fill="#F59E0B">RECRUIT</text>
    </g>
    <g transform="translate(-100, 110)">
      <circle r="26" fill="#1B1728" stroke="#10B981" stroke-width="1.5"/>
      <text y="4" text-anchor="middle" font-family="monospace" font-size="8" fill="#10B981">MENTOR</text>
    </g>
    <g transform="translate(-130, -50)">
      <circle r="26" fill="#1B1728" stroke="#3B82F6" stroke-width="1.5"/>
      <text y="4" text-anchor="middle" font-family="monospace" font-size="8" fill="#3B82F6">SCHEMA</text>
    </g>
  </g>
  <text x="400" y="440" text-anchor="middle" font-family="monospace" font-size="12" fill="#A855F7">DEFEND-X // MULTI-AGENT READINESS SYSTEM</text>
</svg>
