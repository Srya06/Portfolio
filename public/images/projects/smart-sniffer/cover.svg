<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="ssBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0D12"/>
      <stop offset="100%" stop-color="#121824"/>
    </linearGradient>
    <linearGradient id="lineGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#ssBg)"/>
  <!-- Network grid -->
  <g stroke="rgba(56, 189, 248, 0.1)" stroke-width="1">
    <line x1="80" y1="80" x2="720" y2="80"/>
    <line x1="80" y1="160" x2="720" y2="160"/>
    <line x1="80" y1="240" x2="720" y2="240"/>
    <line x1="80" y1="320" x2="720" y2="320"/>
    <line x1="80" y1="400" x2="720" y2="400"/>
  </g>
  <!-- Packet waveform telemetry -->
  <path d="M 80 240 Q 140 220 200 240 T 320 180 T 400 300 T 480 140 T 560 270 T 640 210 T 720 240" fill="none" stroke="url(#lineGlow)" stroke-width="3"/>
  <!-- Status badges and telemetry nodes -->
  <circle cx="480" cy="140" r="6" fill="#38BDF8" filter="drop-shadow(0 0 8px #38BDF8)"/>
  <rect x="420" y="90" width="120" height="32" rx="6" fill="#131B2A" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="480" y="110" text-anchor="middle" font-family="monospace" font-size="10" fill="#38BDF8">TCP/IP 8080 PKT</text>
  <text x="400" y="440" text-anchor="middle" font-family="monospace" font-size="12" fill="#38BDF8">SMART-SNIFFER // REAL-TIME NETWORK TELEMETRY</text>
</svg>