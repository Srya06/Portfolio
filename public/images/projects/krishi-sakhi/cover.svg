<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="ksBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E10"/>
      <stop offset="100%" stop-color="#0F1F17"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#ksBg)"/>
  <!-- Soil & Crop Prediction Visual -->
  <g transform="translate(120, 100)">
    <rect width="560" height="280" rx="16" fill="#141E18" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5"/>
    <text x="40" y="45" font-family="monospace" font-size="13" fill="#10B981" font-weight="bold">Krishi Sakhi // Soil Parameter Vector Analysis</text>
    <!-- Feature dials -->
    <g transform="translate(50, 80)">
      <rect width="130" height="80" rx="8" fill="#1A2820"/>
      <text x="65" y="30" text-anchor="middle" font-family="monospace" font-size="10" fill="#A09C94">NITROGEN (N)</text>
      <text x="65" y="60" text-anchor="middle" font-family="monospace" font-size="18" fill="#10B981" font-weight="bold">84 mg/kg</text>
    </g>
    <g transform="translate(210, 80)">
      <rect width="130" height="80" rx="8" fill="#1A2820"/>
      <text x="65" y="30" text-anchor="middle" font-family="monospace" font-size="10" fill="#A09C94">POTASSIUM (K)</text>
      <text x="65" y="60" text-anchor="middle" font-family="monospace" font-size="18" fill="#10B981" font-weight="bold">42 mg/kg</text>
    </g>
    <g transform="translate(370, 80)">
      <rect width="130" height="80" rx="8" fill="#1A2820"/>
      <text x="65" y="30" text-anchor="middle" font-family="monospace" font-size="10" fill="#A09C94">SOIL pH</text>
      <text x="65" y="60" text-anchor="middle" font-family="monospace" font-size="18" fill="#10B981" font-weight="bold">6.5 pH</text>
    </g>
    <!-- Output prediction banner -->
    <rect x="50" y="190" width="450" height="50" rx="8" fill="#1F3327" stroke="#10B981" stroke-width="1"/>
    <text x="70" y="220" font-family="sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold">Predicted Crop: Maize / Chickpea</text>
    <text x="420" y="220" font-family="monospace" font-size="11" fill="#10B981">Confidence: 94.2%</text>
  </g>
</svg>
