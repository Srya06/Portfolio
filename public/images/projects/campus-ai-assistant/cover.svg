<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="caBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E10"/>
      <stop offset="100%" stop-color="#1B1322"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#caBg)"/>
  <!-- Conversational Campus Assistant Interface -->
  <g transform="translate(120, 80)">
    <rect width="560" height="320" rx="14" fill="#1C1524" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1.5"/>
    <!-- Chat Header -->
    <rect width="560" height="45" rx="14" fill="#241B2E"/>
    <circle cx="30" cy="22" r="5" fill="#A855F7"/>
    <text x="45" y="27" font-family="monospace" font-size="11" fill="#A855F7">Campus AI Assistant // Student Retrieval Context</text>
    <!-- Chat bubbles -->
    <g transform="translate(40, 75)">
      <!-- User message -->
      <rect x="180" y="0" width="300" height="40" rx="8" fill="#2B1D38"/>
      <text x="195" y="24" font-family="sans-serif" font-size="11" fill="#FFFFFF">When is the final lab exam schedule released?</text>
      <!-- Assistant response -->
      <rect x="0" y="60" width="380" height="65" rx="8" fill="#191322" stroke="rgba(168, 85, 247, 0.4)"/>
      <text x="15" y="85" font-family="sans-serif" font-size="11" fill="#A855F7">MIT Mysore Circular Ref: CS/EXAM/2026/04</text>
      <text x="15" y="105" font-family="sans-serif" font-size="11" fill="#A09C94">The 8th Semester AI/ML lab exams commence from Dec 2nd.</text>
    </g>
  </g>
</svg>
