<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="ptBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E10"/>
      <stop offset="100%" stop-color="#0E1920"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#ptBg)"/>
  <!-- Demand Forecasting Chart -->
  <g transform="translate(100, 80)">
    <rect width="600" height="320" rx="14" fill="#131B22" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1.5"/>
    <text x="40" y="45" font-family="monospace" font-size="13" fill="#00F0FF" font-weight="bold">Public Transport Demand Forecasting // Route 14A</text>
    <!-- Grid axes -->
    <g stroke="rgba(255, 255, 255, 0.08)" stroke-width="1">
      <line x1="50" y1="260" x2="540" y2="260"/>
      <line x1="50" y1="200" x2="540" y2="200"/>
      <line x1="50" y1="140" x2="540" y2="140"/>
      <line x1="50" y1="80" x2="540" y2="80"/>
    </g>
    <!-- Actual vs Predicted Curves -->
    <path d="M 60 230 Q 140 250 200 120 T 320 180 T 420 90 T 520 160" fill="none" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M 60 225 Q 140 240 200 115 T 320 175 T 420 95 T 520 155" fill="none" stroke="url(#cyanLine)" stroke-width="3"/>
    <!-- Legend -->
    <circle cx="340" cy="40" r="4" fill="#00F0FF"/>
    <text x="350" y="44" font-family="monospace" font-size="10" fill="#00F0FF">Predicted Demand</text>
    <circle cx="480" cy="40" r="4" fill="#A09C94"/>
    <text x="490" y="44" font-family="monospace" font-size="10" fill="#A09C94">Actual Baseline</text>
  </g>
</svg>
