<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="htBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E10"/>
      <stop offset="100%" stop-color="#1A1813"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#htBg)"/>
  <!-- UI Pipeline Board Mockup -->
  <g transform="translate(60, 60)">
    <rect width="680" height="360" rx="12" fill="#17171C" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.5"/>
    <!-- Header -->
    <rect width="680" height="45" rx="12" fill="#1F1E1A"/>
    <circle cx="30" cy="22" r="5" fill="#EF4444"/>
    <circle cx="50" cy="22" r="5" fill="#F59E0B"/>
    <circle cx="70" cy="22" r="5" fill="#10B981"/>
    <text x="100" y="27" font-family="monospace" font-size="12" fill="#F59E0B">HireTrack // Candidate Preparation Board</text>
    <!-- Columns -->
    <g transform="translate(30, 70)">
      <!-- Col 1 -->
      <rect x="0" y="0" width="180" height="250" rx="8" fill="#121216"/>
      <text x="15" y="25" font-family="monospace" font-size="11" fill="#A09C94">APPLIED (14)</text>
      <rect x="15" y="40" width="150" height="50" rx="6" fill="#1D1D24" stroke="rgba(255,255,255,0.06)"/>
      <text x="25" y="65" font-family="sans-serif" font-size="11" fill="#FFFFFF" font-weight="bold">AI Software Intern</text>
      <!-- Col 2 -->
      <rect x="210" y="0" width="180" height="250" rx="8" fill="#121216"/>
      <text x="225" y="25" font-family="monospace" font-size="11" fill="#F59E0B">INTERVIEW (4)</text>
      <rect x="225" y="40" width="150" height="50" rx="6" fill="#241E15" stroke="rgba(245, 158, 11, 0.4)"/>
      <text x="235" y="65" font-family="sans-serif" font-size="11" fill="#F59E0B" font-weight="bold">Tech Round II</text>
      <!-- Col 3 -->
      <rect x="420" y="0" width="180" height="250" rx="8" fill="#121216"/>
      <text x="435" y="25" font-family="monospace" font-size="11" fill="#10B981">OFFERS (2)</text>
      <rect x="435" y="40" width="150" height="50" rx="6" fill="#14241B" stroke="rgba(16, 185, 129, 0.4)"/>
      <text x="445" y="65" font-family="sans-serif" font-size="11" fill="#10B981" font-weight="bold">Full-Stack Dev</text>
    </g>
  </g>
</svg>
