<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 840" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E10" />
      <stop offset="50%" stop-color="#17171A" />
      <stop offset="100%" stop-color="#0E0E10" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>
    <pattern id="circuitGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
      <circle cx="0" cy="0" r="1.5" fill="rgba(0, 240, 255, 0.3)" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="840" fill="url(#bgGrad)" />
  <rect width="600" height="840" fill="url(#circuitGrid)" />

  <!-- Ambient glow circles -->
  <circle cx="300" cy="380" r="180" fill="#00F0FF" opacity="0.08" filter="blur(40px)" />
  <circle cx="380" cy="480" r="140" fill="#7000FF" opacity="0.08" filter="blur(40px)" />

  <!-- Stylized Geometric Portrait Avatar -->
  <g transform="translate(300, 400)">
    <!-- Tech Rings -->
    <circle r="140" fill="none" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1.5" stroke-dasharray="8 6" />
    <circle r="165" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <circle r="185" fill="none" stroke="rgba(0, 240, 255, 0.15)" stroke-width="1" stroke-dasharray="2 12" />

    <!-- Silhouette Base -->
    <!-- Shoulders -->
    <path d="M -120 180 Q -100 80 0 70 Q 100 80 120 180 Z" fill="#1C1C22" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1.5" />
    <!-- Collar / Neck -->
    <path d="M -35 80 L 0 110 L 35 80 L 25 15 L -25 15 Z" fill="#25252D" />
    <!-- Head / Face silhouette -->
    <path d="M -50 -10 C -50 -80 50 -80 50 -10 C 50 45 25 70 0 75 C -25 70 -50 45 -50 -10 Z" fill="#2D2D38" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1.5" />
    <!-- Hair outline -->
    <path d="M -54 -20 C -58 -90 -10 -115 0 -115 C 20 -115 58 -95 54 -20 C 45 -65 -35 -65 -54 -20 Z" fill="#17171D" />

    <!-- Stylized AI Visor / Optical Node -->
    <rect x="-35" y="-18" width="70" height="8" rx="4" fill="url(#cyanGrad)" />
    <circle cx="0" cy="-14" r="3" fill="#FFFFFF" />

    <!-- Connection Nodes -->
    <line x1="-140" y1="0" x2="-80" y2="0" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1" />
    <circle cx="-140" cy="0" r="3" fill="#00F0FF" />
    <line x1="80" y1="0" x2="140" y2="0" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1" />
    <circle cx="140" cy="0" r="3" fill="#00F0FF" />
  </g>

  <!-- Technical Spec Watermark -->
  <text x="30" y="50" font-family="monospace" font-size="12" fill="#00F0FF" opacity="0.8">SPEC: AI-ML-CORE // ID: SYA-06</text>
  <text x="30" y="70" font-family="monospace" font-size="10" fill="#A09C94" opacity="0.6">MODEL ORCHESTRATION &amp; DATA SYSTEMS</text>
  <text x="570" y="50" text-anchor="end" font-family="monospace" font-size="12" fill="#00F0FF" opacity="0.8">LOC: 12.2958° N</text>

  <!-- Bottom Scan Line -->
  <line x1="30" y1="790" x2="570" y2="790" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
  <text x="300" y="815" text-anchor="middle" font-family="monospace" font-size="11" fill="#A09C94">SURYA D · APPLIED AI PRODUCT WORKBENCH</text>
</svg>
