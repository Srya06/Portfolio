<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 520" width="100%" height="100%">
  <defs>
    <linearGradient id="fsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E10"/>
      <stop offset="50%" stop-color="#1D1812"/>
      <stop offset="100%" stop-color="#140E08"/>
    </linearGradient>
  </defs>
  <rect width="320" height="520" fill="url(#fsGrad)"/>
  <!-- Stack Layers: Frontend -> API -> Database -->
  <g transform="translate(60, 110)">
    <!-- Frontend Layer -->
    <rect x="0" y="0" width="200" height="38" rx="6" fill="#241C15" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="100" y="24" text-anchor="middle" font-family="monospace" font-size="10" fill="#F59E0B">CLIENT INTERFACES (NEXT.JS)</text>
    <!-- Connector -->
    <line x1="100" y1="38" x2="100" y2="60" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3 3"/>
    <!-- API Layer -->
    <rect x="0" y="60" width="200" height="38" rx="6" fill="#241C15" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="100" y="84" text-anchor="middle" font-family="monospace" font-size="10" fill="#F59E0B">FASTAPI / REST CONTROLLERS</text>
    <!-- Connector -->
    <line x1="100" y1="98" x2="100" y2="120" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3 3"/>
    <!-- DB Layer -->
    <rect x="0" y="120" width="200" height="38" rx="6" fill="#241C15" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="100" y="144" text-anchor="middle" font-family="monospace" font-size="10" fill="#F59E0B">POSTGRESQL &amp; VECTOR RETRIEVAL</text>
  </g>
  <!-- Labels -->
  <text x="160" y="380" text-anchor="middle" font-family="monospace" font-size="12" fill="#F59E0B" font-weight="bold">FULL-STACK PRODUCTS</text>
  <text x="160" y="405" text-anchor="middle" font-family="monospace" font-size="9" fill="#A09C94">HIRETRACK &amp; END-TO-END APPS</text>
</svg>
