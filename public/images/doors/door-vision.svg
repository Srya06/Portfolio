<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 520" width="100%" height="100%">
  <defs>
    <linearGradient id="cvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E10"/>
      <stop offset="50%" stop-color="#201116"/>
      <stop offset="100%" stop-color="#160B0E"/>
    </linearGradient>
  </defs>
  <rect width="320" height="520" fill="url(#cvGrad)"/>
  <!-- Computer Vision Bounding Box & Convolution Matrix -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="200" height="170" rx="12" fill="#251219" stroke="rgba(244, 63, 94, 0.3)" stroke-width="1"/>
    <!-- Target Focus reticle -->
    <rect x="35" y="25" width="130" height="120" fill="none" stroke="#F43F5E" stroke-width="1.5" stroke-dasharray="6 4"/>
    <!-- Corner brackets -->
    <path d="M 25 35 L 25 15 L 45 15" fill="none" stroke="#F43F5E" stroke-width="2.5"/>
    <path d="M 175 35 L 175 15 L 155 15" fill="none" stroke="#F43F5E" stroke-width="2.5"/>
    <path d="M 25 135 L 25 155 L 45 155" fill="none" stroke="#F43F5E" stroke-width="2.5"/>
    <path d="M 175 135 L 175 155 L 155 155" fill="none" stroke="#F43F5E" stroke-width="2.5"/>
    <!-- Crosshairs -->
    <line x1="100" y1="75" x2="100" y2="95" stroke="#F43F5E" stroke-width="1.5"/>
    <line x1="90" y1="85" x2="110" y2="85" stroke="#F43F5E" stroke-width="1.5"/>
  </g>
  <!-- Labels -->
  <text x="160" y="380" text-anchor="middle" font-family="monospace" font-size="12" fill="#F43F5E" font-weight="bold">COMPUTER VISION &amp; GENAI</text>
  <text x="160" y="405" text-anchor="middle" font-family="monospace" font-size="9" fill="#A09C94">DERMAAI &amp; LESION IMAGE SUITE</text>
</svg>
