<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 520" width="100%" height="100%">
  <defs>
    <linearGradient id="agentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E10"/>
      <stop offset="50%" stop-color="#191322"/>
      <stop offset="100%" stop-color="#120A1C"/>
    </linearGradient>
    <linearGradient id="purpleLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>
  <rect width="320" height="520" fill="url(#agentGrad)"/>
  <!-- Agent flow network -->
  <g stroke="rgba(168, 85, 247, 0.15)" stroke-width="1">
    <line x1="160" y1="120" x2="80" y2="200"/>
    <line x1="160" y1="120" x2="240" y2="200"/>
    <line x1="80" y1="200" x2="160" y2="280"/>
    <line x1="240" y1="200" x2="160" y2="280"/>
    <line x1="160" y1="280" x2="160" y2="340"/>
  </g>
  <!-- Orchestrator Center Node -->
  <circle cx="160" cy="120" r="18" fill="#1C142E" stroke="#A855F7" stroke-width="2"/>
  <circle cx="160" cy="120" r="6" fill="#A855F7"/>
  <!-- Sub-agents -->
  <circle cx="80" cy="200" r="14" fill="#1C142E" stroke="#EC4899" stroke-width="1.5"/>
  <circle cx="240" cy="200" r="14" fill="#1C142E" stroke="#EC4899" stroke-width="1.5"/>
  <!-- Tool Execution Node -->
  <rect x="135" y="265" width="50" height="30" rx="6" fill="#1C142E" stroke="#A855F7" stroke-width="1.5"/>
  <circle cx="160" cy="280" r="4" fill="#00F0FF"/>
  <!-- Labels -->
  <text x="160" y="380" text-anchor="middle" font-family="monospace" font-size="12" fill="#A855F7" font-weight="bold">AGENTIC SYSTEMS &amp; LLMS</text>
  <text x="160" y="405" text-anchor="middle" font-family="monospace" font-size="9" fill="#A09C94">MULTI-AGENT ORCHESTRATION &amp; RAG</text>
</svg>
