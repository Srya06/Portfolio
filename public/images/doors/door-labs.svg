      <stop offset="0%" stop-color="#0E0E10"/>
      <stop offset="50%" stop-color="#0E1B13"/>
      <stop offset="100%" stop-color="#09130D"/>
    </linearGradient>
  </defs>
  <rect width="320" height="520" fill="url(#labsGrad)"/>
  <!-- Terminal Prompt & Container Nodes -->
