    <text x="15" y="80" font-family="monospace" font-size="9" fill="#A09C94">container id: 7b84f29a</text>
    <text x="15" y="105" font-family="monospace" font-size="9" fill="#10B981">&gt; test_suite --coverage</text>
    <text x="15" y="130" font-family="monospace" font-size="9" fill="#3DDC97">PASS: 100% verified</text>
